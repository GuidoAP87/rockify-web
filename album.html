<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKIFY | Álbum</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo-container" onclick="window.location.href='index.html'">
            <svg class="malvinas-icon" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
                <path d="M130 180 Q 150 150 170 160 T 190 200 T 160 240 T 130 220 Z" /> 
                <path d="M220 160 Q 250 140 280 150 T 300 200 T 260 250 T 220 230 Z" /> 
                <path d="M100 100 L 120 120 M 310 250 L 330 270" stroke="currentColor" stroke-width="5" opacity="0.5"/> 
            </svg>
            <span class="logo-text">ROCKIFY <span class="arg-flag">ARG</span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">INICIO</a></li>
            <li><a href="index.html#artistas">ARTISTAS</a></li>
        </ul>
    </nav>

    <div class="album-page-container">
        
        <div id="album-bg" class="album-background"></div>

        <div class="container">
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-chevron-left"></i> VOLVER
            </a>

            <div class="album-grid-layout">
                
                <div class="album-cover-section">
                    <div class="vinyl-presentation">
                        <img id="album-cover-img" src="" alt="Album Cover" class="main-cover">
                        
                        <div class="vinyl-disk-decoration">
                            <img id="vinyl-label-img" src="" alt="Label">
                        </div>
                    </div>
                </div>

                <div class="album-info-section">
                    <h3 id="album-artist-name" class="artist-uptitle">NOMBRE ARTISTA</h3>
                    <h1 id="album-title" class="album-big-title">TÍTULO DEL ÁLBUM</h1>
                    
                    <div class="album-meta">
                        <span class="badge-year" id="album-year">AÑO</span>
                        <span class="dot">•</span>
                        <span id="album-tracks-count">0 Canciones</span>
                    </div>

                    <p class="album-description">
                        Una obra fundamental en la discografía de <span id="review-artist">...</span>. 
                        Lanzado en <span id="review-year">...</span>.
                    </p>

                    <button class="btn-play-all" onclick="playFullAlbum()">
                        <i class="fas fa-play"></i> ESCUCHAR TODO
                    </button>

                    <hr class="divider">

                    <ul id="full-tracklist" class="album-tracklist">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <div id="vinyl-player" class="vinyl-container hidden" onclick="togglePlayPause()">
        <div class="vinyl-disk">
            <img id="vinyl-cover" src="img/default.png" alt="Album Cover" class="vinyl-cover-art">
            <div class="vinyl-hole"></div>
        </div>
        <div class="vinyl-info">
            <div class="scrolling-text-container">
                <div class="scrolling-text">
                    <span id="player-song" class="song-title">Canción</span>
                    <span class="separator">•</span>
                    <span id="player-artist" class="artist-name">Artista</span>
                    <span class="separator">•</span>
                    <span id="player-album" class="album-name">Álbum</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
